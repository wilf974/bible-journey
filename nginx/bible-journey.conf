# Bible Journey - Nginx Site Configuration
# Copy this file to /etc/nginx/sites-available/bible-journey.conf
# Then: ln -s /etc/nginx/sites-available/bible-journey.conf /etc/nginx/sites-enabled/
# Then: certbot --nginx -d bible-journey.woutils.com
# Finally: nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name bible-journey.woutils.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bible-journey.woutils.com;

    # SSL will be configured by Certbot
    # ssl_certificate /etc/letsencrypt/live/bible-journey.woutils.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/bible-journey.woutils.com/privkey.pem;

    # Main Application (port 3010)
    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase Auth API (port 8000)
    location /auth/ {
        proxy_pass http://127.0.0.1:8000/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase REST API (port 8000)
    location /rest/ {
        proxy_pass http://127.0.0.1:8000/rest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Supabase Realtime WebSocket (port 8000)
    location /realtime/ {
        proxy_pass http://127.0.0.1:8000/realtime/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
