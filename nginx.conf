# Configuration Nginx pour Bible Journey (Docker)
# Sous-domaine: bible-journey.woutils.com
# Reverse proxy vers le conteneur Docker sur le port 3010

server {
    listen 80;
    server_name bible-journey.woutils.com;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    access_log /var/log/nginx/bible-journey.access.log;
    error_log /var/log/nginx/bible-journey.error.log;
}
