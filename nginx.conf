# Configuration Nginx pour Bible Journey
# Sous-domaine: bible-journey.woutils.com
# Chemin: /opt/apps/bible-journey

server {
    listen 80;
    server_name bible-journey.woutils.com;

    # Redirection HTTP vers HTTPS
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bible-journey.woutils.com;

    # Certificats SSL (Certbot les mettra à jour automatiquement)
    ssl_certificate /etc/letsencrypt/live/bible-journey.woutils.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bible-journey.woutils.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /opt/apps/bible-journey/dist;
    index index.html;

    # Gestion des routes SPA (React Router)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache des assets statiques
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Sécurité headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Logs spécifiques à ce site
    access_log /var/log/nginx/bible-journey.access.log;
    error_log /var/log/nginx/bible-journey.error.log;
}
